name: droidspaces-kernel

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/droidspaces.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev python3 zip unzip curl

      - name: Fetch clang
        run: |
          set -euo pipefail
          curl -L --retry 3 --retry-delay 5 -o /tmp/clang.tar.gz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-14.0.0_r1/clang-r487747c.tar.gz"
          mkdir -p "$HOME/clang"
          tar -xzf /tmp/clang.tar.gz -C "$HOME/clang"
          "$HOME/clang/bin/clang" --version

      - name: Apply Droidspaces kernel patches
        run: |
          set -euo pipefail
          BASE="https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/non-GKI"
          curl -fsSL -o /tmp/01.patch "$BASE/01.fix_kernel_panic_in_xt_qtaguid.patch"
          curl -fsSL -o /tmp/02.patch "$BASE/02.fix_restore%20cgroup%20file%20prefix%20handling%20.patch"
          patch -p1 --forward < /tmp/01.patch || echo "patch 01 skipped"
          patch -p1 --forward < /tmp/02.patch || echo "patch 02 skipped"

      - name: Configure
        run: |
          set -euo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          export MAKE_OPTS="LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make O=out ARCH=arm64 $MAKE_OPTS cepheus_defconfig
          scripts/config --file out/.config \
            -e SYSVIPC -e POSIX_MQUEUE -e IPC_NS -e PID_NS -e UTS_NS \
            -e DEVTMPFS -e DEVTMPFS_MOUNT -e CGROUP_DEVICE -e CGROUP_PIDS \
            -e CGROUP_CPUACCT -e MEMCG -e USER_NS -e MACVLAN -e SECCOMP_FILTER \
            -e VETH -e BRIDGE -e NET_NS -e TUN \
            -d ANDROID_PARANOID_NETWORK -d COMPAT_VDSO
          make O=out ARCH=arm64 $MAKE_OPTS olddefconfig
          grep -E 'CONFIG_(SYSVIPC|IPC_NS|PID_NS|UTS_NS|DEVTMPFS|CGROUP_DEVICE|SECCOMP_FILTER|VETH|BRIDGE|TUN)=' out/.config

      - name: Build kernel
        run: |
          set -euo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          export MAKE_OPTS="LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          make O=out ARCH=arm64 $MAKE_OPTS -j"$(nproc)" Image.gz-dtb

      - name: Verify veth and bridge are linked in
        run: |
          set -euo pipefail
          export PATH="$HOME/clang/bin:$PATH"
          echo "--- config ---"
          grep -E '^CONFIG_(VETH|BRIDGE|TUN|NET_NS)=' out/.config || true
          echo "--- vmlinux symbols ---"
          for sym in veth_newlink veth_setup br_add_bridge; do
            if llvm-nm out/vmlinux 2>/dev/null | grep -q " $sym$"; then
              echo "OK   $sym"
            else
              echo "MISS $sym"
            fi
          done
          llvm-nm out/vmlinux 2>/dev/null | grep -q ' veth_newlink$' || { echo "VETH_MISSING: driver did not link"; exit 1; }
          echo "veth present in vmlinux"


      - name: Package kernel image
        run: |
          set -euo pipefail
          cp out/arch/arm64/boot/Image Image
          cp out/arch/arm64/boot/Image.gz-dtb Image.gz-dtb
          ls -lh Image Image.gz-dtb
          sha256sum Image Image.gz-dtb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-images
          path: |
            Image
            Image.gz-dtb

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "build-${{ github.run_number }}" Image Image.gz-dtb \
            --repo "$GITHUB_REPOSITORY" \
            --title "droidspaces kernel build ${{ github.run_number }}" \
            --notes "cepheus 4.14 + Droidspaces namespaces; repack on device with magiskboot (replace kernel, keep kernel_dtb)"
